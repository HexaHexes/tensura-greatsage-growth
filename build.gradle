plugins {
    id 'java-library'
    id 'maven-publish'
    id 'checkstyle'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.github.spotbugs' version '6.5.13'
    id 'com.diffplug.spotless' version '8.10.4'
}

version = mod_version
group = mod_group_id

base {
    // Must match rootProject.name and mod_id; the jar is <mod_id>-<version>.jar.
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Game tests compile against main but are never part of it, so the jar cannot
// ship them. Declared before neoForge because the mods block joins it.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + configurations.runtimeClasspath
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        // Headless verification: boots GameTestServer, runs every @GameTest, exits.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.layout.projectDirectory.dir('run')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            // Joined so @GameTestHolder is discovered in dev runs; still not jarred.
            sourceSet sourceSets.gametest
        }
    }
}

// Expands the ${...} placeholders in src/main/templates into the real
// neoforge.mods.toml, so mod identity is edited in gradle.properties only.
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
// Passing the provider as a source dir also wires the generation order.
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The junit CI check refuses to pass an empty suite, so this stays wired in
// every derived repo.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
    // Resolved manascore core artifact; its nested module jars are extracted
    // into build/ for the compile classpath (see extractManascoreModules).
    manascoreModules
}
repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

// Compiled-against view of the extracted manascore module jars; the file
// tree fills in when extractManascoreModules runs.
def manascoreModuleJars = files(fileTree(dir: layout.buildDirectory.dir('manascore-modules').get().asFile, include: '**/*.jar'))
manascoreModuleJars.builtBy 'extractManascoreModules'

tasks.register('extractManascoreModules', Sync) {
    from { zipTree(configurations.manascoreModules.singleFile) }
    include 'META-INF/jars/*.jar'
    into layout.buildDirectory.dir('manascore-modules')
}
dependencies {
    // Great Sage (the addon this mod extends) and its stack, at the pack's pins.
    compileOnly 'maven.modrinth:great-sage:0.0.7.1'
    compileOnly 'curse.maven:tensura-reincarnated-643695:8793360'  // tensura-neoforge-2.0.1.3
    compileOnly 'curse.maven:manascore-619025:8022425'             // manascore-neoforge-4.0.0.2 (core)
    compileOnly 'curse.maven:architectury-api-419699:5786327'    // architectury-api (SkillRegistry returns its Registrar type)
    compileOnly manascoreModuleJars
    manascoreModules 'curse.maven:manascore-619025:8022425'
    localRuntime 'curse.maven:tensura-reincarnated-643695:8793360'
    localRuntime 'maven.modrinth:great-sage:0.0.7.1'
    localRuntime 'curse.maven:manascore-619025:8022425'
    localRuntime 'curse.maven:architectury-api-419699:5786327'
    localRuntime "curse.maven:geckolib-388172:8309311"
    localRuntime "curse.maven:smartbrainlib-661293:7055149"
    localRuntime "curse.maven:terrablender-neoforge-940057:6054947"
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// --- GameTest harness -------------------------------------------------------

// Grade the run on the log summary: the task's exit code is not a reliable
// signal. Keep expectedTests in sync with the @GameTest methods.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    def expectedTests = 4
    doLast {
        def log = file('run/logs/latest.log')
        if (!log.exists()) {
            throw new GradleException("GameTest produced no log at ${log}")
        }
        def text = log.text
        def problems = []
        def passMatcher = (text =~ /All (\d+) required tests passed/)
        if (passMatcher.find()) {
            def passed = passMatcher.group(1) as int
            if (passed != expectedTests) {
                problems << "only ${passed}/${expectedTests} tests passed"
            }
        } else if ((text =~ /\d+ required tests failed/).find()) {
            problems << 'GameTest reported failed tests'
        } else {
            problems << 'no GameTest summary found in log'
        }
        if (text.contains('Encountered an unexpected exception')) {
            problems << 'server crashed during tests'
        }
        if (problems) {
            throw new GradleException("GameTest failed: ${problems.join('; ')} - see ${log}")
        }
        logger.lifecycle("GameTest OK: all ${expectedTests} tests passed")
    }
}

// --- Publishing -------------------------------------------------------------

// release.yml tags, publish.yml drives this block. Keep the URL pointing at
// THIS repository; local publishes may set gpr.user / gpr.key.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = mod_id
            pom {
                name = mod_name
                description = mod_description
                licenses {
                    license {
                        name = mod_license
                    }
                }
            }
        }
    }
    configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
    // Resolved manascore core artifact; its nested module jars are extracted
    // into build/ for the compile classpath (see extractManascoreModules).
    manascoreModules
}
repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/HexaHexes/tensura-greatsage-growth')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
                password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
            }
        }
    }
}

// --- Static analysis (enforced) ----------------------------------------------
// The `static` CI job is the gate for all three. SpotBugs and Checkstyle ride
// Gradle's `check` graph too; Spotless stays out of it by design. Rationale and
// the shared-filter rules live in agents/AGENTS.md.
spotbugs {
    effort = com.github.spotbugs.snom.Effort.MAX
    excludeFilter = file('config/spotbugs-exclude.xml')
}

spotbugsTest {
    enabled = false
}

spotbugsMain {
    reports {
        html.required = true
        xml.required = false
    }
}

checkstyle {
    toolVersion = '10.21.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}

tasks.withType(Checkstyle).configureEach {
    reports {
        html.required = true
        xml.required = false
    }
}

spotless {
    enforceCheck false
    java {
        // Minimal profile only: no formatter, so no repo-wide rewrites.
        target 'src/*/java/**/*.java'
        trimTrailingWhitespace()
        endWithNewline()
        importOrder()
    }
}
